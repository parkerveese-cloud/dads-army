# Dads Army as a Home Assistant app.
# To release an update: raise "version" (and dadsarmy/server.py VERSION), add a CHANGELOG.md entry, push.
name: Dads Army
version: "2.0.0"
slug: dadsarmy
description: Home front stores tracker for food, water and emergency kit, with live UK alerts.
url: https://github.com/parkerveese-cloud/dads-army
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Publishes sensor.dads_army_* entities for dashboards and automations.
homeassistant_api: true
# Home Assistant restarts it if this stops answering.
watchdog: http://[HOST]:[PORT:8080]/api/health
# Shows up in the Home Assistant sidebar (and the Companion app).
ingress: true
ingress_port: 8080
panel_icon: mdi:chevron-triple-up
panel_title: Dads Army
# Also reachable directly on the home network, for the phone's home-screen app.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Dads Army on your home network (http://<home-assistant>:8080)
# Stop it briefly during Home Assistant backups so the database copy is clean.
backup: cold
